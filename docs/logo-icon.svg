<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="momento-intense-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="mm-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Completely Transparent Background (No Rectangle Frame) -->
  <g filter="url(#mm-glow)">
    <!-- Sharp Diamond Analytics Edge Ring -->
    <path d="M 60 10 L 110 60 L 60 110 L 10 60 Z" 
          fill="none" 
          stroke="url(#momento-intense-grad)" 
          stroke-width="4" 
          stroke-dasharray="14 6" 
          stroke-linecap="round" />
    
    <!-- Bold Sharp Edge M Monogram Wave -->
    <path d="M 22 84 L 22 36 L 46 76 L 60 52 L 74 76 L 98 30" 
          fill="none" 
          stroke="url(#momento-intense-grad)" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Center Analytics Core Node -->
    <circle cx="60" cy="52" r="7" fill="#ffffff" filter="url(#mm-glow)" />
    <circle cx="98" cy="30" r="5" fill="#06b6d4" />
    <circle cx="22" cy="84" r="5" fill="#6366f1" />
  </g>
</svg>
