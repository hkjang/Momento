openapi: 3.1.0
info:
  title: Momento Analytics API
  version: 0.9.0
  description: On-premise event collection, reporting, management, and query API.
servers:
  - url: /
paths:
  /collect/v1/events:
    post:
      summary: Accept browser or server events into the durable inbox
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CollectRequest'}
      responses:
        '202': {description: Durable acceptance completed}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/login:
    post:
      summary: Local administrator login
      security: []
      responses: {'200': {description: Session cookie issued}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/sites:
    get:
      summary: List analytics sites
      responses: {'200': {description: Site list}}
    post:
      summary: Create a site and issue its tracking key once
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteMutation'}
      responses: {'201': {description: Site created}}
  /api/v1/sites/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    patch:
      summary: Update site timezone, engagement threshold, domains, and collection settings
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SiteMutation'}
      responses: {'200': {description: Site updated}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/sites/{siteId}/overview:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Dashboard metrics and daily trend
      responses: {'200': {description: Overview}}
  /api/v1/sites/{siteId}/realtime:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Last 1, 5, and 30 minute activity
      responses: {'200': {description: Realtime report}}
  /api/v1/sites/{siteId}/usage:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Internal organization, department, service, feature, button, and network usage
      responses: {'200': {description: Internal usage report}}
  /api/v1/sites/{siteId}/sessions:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List materialized session summaries
      responses: {'200': {description: Session rows}}
  /api/v1/sites/{siteId}/identities:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List deterministic User ID to Visitor ID identity links
      description: Disabled when the Visitor Profile privacy policy is disabled.
      responses: {'200': {description: Identity graph rows}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/sites/{siteId}/ecommerce:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Revenue, commerce funnel, and product performance
      responses: {'200': {description: Ecommerce report}}
  /api/v1/sites/{siteId}/visitors/{visitorId}/timeline:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: visitorId, in: path, required: true, schema: {type: string}}
    get:
      summary: Visitor event timeline; disabled when visitor profiles are disabled
      responses: {'200': {description: Visitor timeline}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/sites/{siteId}/retention:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Read the site retention policy
      responses: {'200': {description: Retention policy}}
    put:
      summary: Replace the site retention policy
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RetentionPolicy'}
      responses: {'200': {description: Updated}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/segments:
    get:
      summary: List visible saved segments
      parameters: [{name: site_id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Segment list}}
    post:
      summary: Create a nested AND/OR segment
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SegmentSaveRequest'}
      responses: {'201': {description: Segment created}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/segments/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    put:
      summary: Update a segment owned by the user or workspace
      responses: {'200': {description: Updated}}
    delete:
      summary: Delete a segment
      responses: {'204': {description: Deleted}}
  /api/v1/dimensions:
    get:
      summary: List the custom dimension registry
      parameters: [{name: site_id, in: query, required: true, schema: {type: string}}]
      responses: {'200': {description: Dimension list}}
    post:
      summary: Register or update a custom dimension
      responses: {'200': {description: Dimension saved}}
  /api/v1/reports:
    get:
      summary: List saved explorations and reports
      parameters:
        - {name: site_id, in: query, required: true, schema: {type: string}}
        - {name: kind, in: query, schema: {type: string}}
      responses: {'200': {description: Saved report list}}
    post:
      summary: Save an exploration, funnel, path, or dashboard definition
      responses: {'201': {description: Report saved}}
  /api/v1/query:
    post:
      summary: Run an allowlisted dimension and metric query
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
      responses: {'200': {description: Query rows}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/privacy/delete:
    post:
      summary: Delete analytics data and atomically reconcile queue payloads, Raw Events, identity links, Visitor/Session summaries, and daily aggregates
      responses: {'200': {description: Data deleted or property scrubbed}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/funnel:
    post:
      summary: Analyze an open or closed 2-10 step event funnel with segment and property conditions
      responses: {'200': {description: Funnel steps}}
  /api/v1/sites/{siteId}/environments:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List DEV/STG/PRD and custom collection environments
      responses: {'200': {description: Environment policies}}
  /api/v1/sites/{siteId}/environments/{name}:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: name, in: path, required: true, schema: {type: string}}
    put:
      summary: Create or update contract mode and cardinality limit for an environment
      responses: {'200': {description: Environment updated}}
  /api/v1/sites/{siteId}/event-contracts:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List versioned event contracts
      responses: {'200': {description: Contract versions}}
    post:
      summary: Create a draft or active event contract version
      responses: {'201': {description: Contract version created}}
  /api/v1/sites/{siteId}/event-contracts/{eventName}/{version}/activate:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: eventName, in: path, required: true, schema: {type: string}}
      - {name: version, in: path, required: true, schema: {type: integer}}
    post:
      summary: Activate an immutable event contract version
      responses: {'200': {description: Contract activated}}
  /api/v1/sites/{siteId}/event-contracts/validate:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    post:
      summary: Validate up to 1000 event payloads for CI without collecting them
      responses: {'200': {description: Contract validation result}}
  /api/v1/sites/{siteId}/semantic-metrics:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List the versioned Semantic Metric Registry
      responses: {'200': {description: Semantic metrics}}
    post:
      summary: Create or version a safe AST-based semantic metric
      responses: {'200': {description: Metric saved}}
  /api/v1/sites/{siteId}/semantic-metrics/{name}/query:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {name: name, in: path, required: true, schema: {type: string}}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Evaluate a registered semantic metric
      responses: {'200': {description: Metric value and definition version}}
  /api/v1/sites/{siteId}/metric-goals:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List Semantic Metric goals
      responses: {'200': {description: Goal definitions}}
    post:
      summary: Create or update a period and organization-scoped Metric goal
      responses: {'200': {description: Goal saved}}
  /api/v1/sites/{siteId}/metric-goals/evaluate:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Evaluate all active Metric goals
      responses: {'200': {description: Goal values and achievement}}
  /api/v1/sites/{siteId}/query-policy:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Read Exact/Fast/Preview cost and sampling policy
      responses: {'200': {description: Query policy}}
    put:
      summary: Update Query Cost Guard and sampling policy
      responses: {'200': {description: Query policy updated}}
  /api/v1/sites/{siteId}/query-audit:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List recent Query Mode, Complexity, duration and outcome audit records
      responses: {'200': {description: Query Audit}}
  /api/v1/sites/{siteId}/aggregate-jobs:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List automatic Late Event and administrator rebuild jobs
      responses: {'200': {description: Aggregate jobs}}
    post:
      summary: Request a date-range or full Raw Event rebuild
      responses: {'202': {description: Rebuild queued}}
  /api/v1/sites/{siteId}/catalog:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Event contract catalog with owner, usage health and consumers
      responses: {'200': {description: Event catalog}}
  /api/v1/sites/{siteId}/lineage:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Event to Metric to Goal lineage graph
      responses: {'200': {description: Lineage nodes and edges}}
  /api/v1/sites/{siteId}/data-quality:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Tracking health, contract, PII, lag, duplicate and cardinality report
      responses: {'200': {description: Data Quality Center report}}
  /api/v1/sites/{siteId}/cohort:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Cohort and retention matrix
      responses: {'200': {description: Retention cohorts}}
  /api/v1/sites/{siteId}/journeys:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List personal and shared Business Journeys
      responses: {'200': {description: Journey definitions}}
    post:
      summary: Save a 2-12 step Business Journey
      responses: {'200': {description: Journey saved}}
  /api/v1/sites/{siteId}/journeys/analyze:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    post:
      summary: Analyze sequential business outcomes with a conversion window
      responses: {'200': {description: Journey conversion and elapsed time}}
  /api/v1/sites/{siteId}/adoption:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Organization, department and feature adoption
      responses: {'200': {description: 'Adoption, repeat use and dormant users'}}
  /api/v1/sites/{siteId}/workspace-rollup:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Workspace service Roll-Up and deterministic cross-site SSO users
      responses: {'200': {description: Workspace and Service Score report}}
  /api/v1/sites/{siteId}/workspace-journeys:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List personal and shared Cross-Site Journeys
      responses: {'200': {description: Workspace Journeys}}
    post:
      summary: Save a 2-12 step Cross-Site Journey
      responses: {'200': {description: Workspace Journey saved}}
  /api/v1/sites/{siteId}/workspace-journeys/analyze:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    post:
      summary: Analyze a deterministic SSO Journey across Workspace Sites
      responses: {'200': {description: Cross-Site conversion and elapsed time}}
  /api/v1/sites/{siteId}/feature-intelligence:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Feature Score, Adoption, trend and Dead Feature candidates
      responses: {'200': {description: Feature Intelligence}}
  /api/v1/sites/{siteId}/search-analytics:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Search Zero Result, CTR, refinement, exit and success
      responses: {'200': {description: Search Analytics}}
  /api/v1/sites/{siteId}/frustration:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Privacy-preserving Frustration signals without Session Replay
      responses: {'200': {description: Frustration Analytics}}
  /api/v1/sites/{siteId}/feature-flags:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List Feature Flag metadata and Variants
      responses: {'200': {description: Feature Flags}}
    post:
      summary: Create or update a Feature Flag
      responses: {'200': {description: Feature Flag saved}}
  /api/v1/sites/{siteId}/experiments:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List governed Experiments
      responses: {'200': {description: Experiments}}
    post:
      summary: Create or update an Experiment with a Semantic primary metric
      responses: {'200': {description: Experiment saved}}
  /api/v1/sites/{siteId}/experiments/{id}/analysis:
    parameters: [{$ref: '#/components/parameters/SiteId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Variant metric, Lift and confidence analysis
      responses: {'200': {description: Experiment analysis}}
  /api/v1/sites/{siteId}/annotations:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List Site and Workspace Change Calendar annotations
      responses: {'200': {description: Annotations}}
    post:
      summary: Create or update a Change Calendar annotation
      responses: {'200': {description: Annotation saved}}
  /api/v1/sites/{siteId}/privacy-requests:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List audited Privacy Requests
      responses: {'200': {description: Privacy Requests}}
    post:
      summary: Create a delete or export authorization request
      responses: {'201': {description: Privacy Request created}}
  /api/v1/sites/{siteId}/privacy-requests/{id}/decision:
    parameters: [{$ref: '#/components/parameters/SiteId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Approve and execute or reject a pending Privacy Request
      responses: {'200': {description: Privacy Request decision}}
  /api/v1/sites/{siteId}/privacy-requests/{id}/export:
    parameters: [{$ref: '#/components/parameters/SiteId'}, {name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Download the authorized completed Privacy Request as NDJSON
      responses: {'200': {description: Audited NDJSON export}}
  /api/v1/sites/{siteId}/experience:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Core Web Vitals, errors, conversion impact and release impact
      responses: {'200': {description: Experience analytics}}
  /api/v1/sites/{siteId}/ai-analytics:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Model, Agent, MCP and Tool usage, latency, tokens and cost
      responses: {'200': {description: AI operations analytics}}
  /api/v1/sites/{siteId}/insights:
    parameters:
      - {$ref: '#/components/parameters/SiteId'}
      - {$ref: '#/components/parameters/Environment'}
    get:
      summary: Offline rule-based change detection and recommended diagnosis
      responses: {'200': {description: Insights}}
  /api/v1/sites/{siteId}/natural-query:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    post:
      summary: Ask Korean or English analytics questions with the offline semantic parser
      responses: {'200': {description: 'Interpreted intent, answer and evidence'}}
  /api/v1/sites/{siteId}/delivery-channels:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List redacted Webhook, Confluence, Mail, internal message and AI Agent channels
      responses: {'200': {description: Delivery channels}}
    post:
      summary: Save a delivery channel; header values are write-only
      responses: {'200': {description: Channel saved}}
  /api/v1/sites/{siteId}/scheduled-reports:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List scheduled reports and Segment actions
      responses: {'200': {description: Schedules}}
    post:
      summary: Schedule report or Segment aggregate delivery
      responses: {'200': {description: Schedule saved}}
  /api/v1/sites/{siteId}/delivery-runs:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: List site-scoped delivery outcomes with redacted errors and HTTP status
      responses: {'200': {description: Delivery runs}}
  /api/v1/sites/{siteId}/install-diagnostics:
    parameters: [{$ref: '#/components/parameters/SiteId'}]
    get:
      summary: Diagnose SDK installation, CSP allowance, allowed domains, environment match, and ingestion pipeline
      responses: {'200': {description: Diagnostic report}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/sites/{id}/reveal-keys:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Show the stored tracking and server API keys again; requires MOMENTO_ENCRYPTION_KEY and an interactive session
      responses: {'200': {description: Stored keys or the reason they are unavailable}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/me/keys/{id}/reveal:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    post:
      summary: Show a stored personal API key again instead of rotating it
      responses: {'200': {description: Stored key or the reason it is unavailable}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/system/encryption:
    get:
      summary: Report secret encryption state, key fingerprint, and recoverable key counts
      responses: {'200': {description: Encryption status}}
  /api/v1/system/encryption/rekey:
    post:
      summary: Re-seal stored secrets with the current primary encryption key
      responses: {'200': {description: Reseal result}, '400': {$ref: '#/components/responses/Error'}}
  /mcp:
    post:
      summary: MCP Streamable HTTP JSON-RPC endpoint
      responses: {'200': {description: JSON-RPC response}}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Personal mom_key_ API key or browser session token
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: {type: string}
    Environment:
      name: environment
      in: query
      required: false
      schema: {type: string, default: prd}
  responses:
    Error:
      description: Structured error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                properties: {code: {type: string}, message: {type: string}}
  schemas:
    CollectRequest:
      type: object
      required: [site_id, visitor_id, session_id, events]
      properties:
        site_id: {type: string}
        environment: {type: string, default: prd, pattern: '^[a-z][a-z0-9_-]{0,31}$'}
        tracking_key: {type: string}
        visitor_id: {type: string, maxLength: 128}
        session_id: {type: string, maxLength: 128}
        user_id: {type: string, maxLength: 128}
        user_properties: {type: object, additionalProperties: true}
        session_properties:
          type: object
          additionalProperties: true
          description: Session-scoped properties merged by event time; available to session-scope dimensions.
        context: {$ref: '#/components/schemas/EventContext'}
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [name, timestamp]
            properties:
              id: {type: string, format: uuid}
              name: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_]{0,63}$'}
              timestamp: {type: integer}
              contract_version: {type: integer, minimum: 1, default: 1}
              properties: {type: object, additionalProperties: true}
              session_properties:
                type: object
                additionalProperties: true
                description: Occurrence-time session property snapshot; overrides the request-level fallback.
              context:
                allOf:
                  - {$ref: '#/components/schemas/EventContext'}
                description: Event occurrence-time snapshot; overrides the request-level fallback context.
    EventContext:
      type: object
      properties:
        page:
          type: object
          properties:
            url: {type: string, format: uri}
            title: {type: string}
            referrer: {type: string}
        device:
          type: object
          properties:
            type: {type: string}
            browser: {type: string}
            os: {type: string}
            language: {type: string}
            screen: {type: string}
        traffic:
          type: object
          properties:
            source: {type: string}
            medium: {type: string}
            campaign: {type: string}
            term: {type: string}
            content: {type: string}
    SiteMutation:
      type: object
      required: [name, session_timeout_minutes, timezone, engagement_threshold_seconds]
      properties:
        name: {type: string}
        service_name: {type: string}
        allowed_domains: {type: array, items: {type: string}}
        session_timeout_minutes: {type: integer, minimum: 1, maximum: 1440}
        timezone: {type: string, examples: [Asia/Seoul]}
        engagement_threshold_seconds: {type: integer, minimum: 1, maximum: 300, default: 10}
        active: {type: boolean}
    QueryRequest:
      type: object
      required: [site_id, date_range, metrics]
      properties:
        site_id: {type: string}
        environment: {type: string, default: prd}
        mode: {type: string, enum: [exact, fast, preview], default: exact}
        date_range:
          type: object
          required: [from, to]
          properties: {from: {type: string, format: date}, to: {type: string, format: date}}
        dimensions: {type: array, items: {type: string}}
        metrics: {type: array, items: {type: string}}
        filters: {type: array, items: {type: object}}
        segment_id: {type: string, format: uuid}
        segment: {$ref: '#/components/schemas/SegmentNode'}
    SegmentNode:
      oneOf:
        - type: object
          required: [combinator, rules]
          properties:
            combinator: {type: string, enum: [and, or]}
            rules:
              type: array
              minItems: 1
              maxItems: 50
              items: {$ref: '#/components/schemas/SegmentNode'}
        - type: object
          required: [field, operator]
          properties:
            field: {type: string}
            operator:
              type: string
              enum: ['=', '!=', contains, 'not contains', startsWith, endsWith, '>', '>=', '<', '<=', exists, 'not exists', in, 'not in']
            value: {}
    SegmentSaveRequest:
      type: object
      required: [site_id, name, definition]
      properties:
        site_id: {type: string}
        name: {type: string}
        description: {type: string}
        shared: {type: boolean}
        definition: {$ref: '#/components/schemas/SegmentNode'}
    RetentionPolicy:
      type: object
      required: [raw_event_months, session_months, realtime_hours, debug_days]
      properties:
        raw_event_months: {type: integer, minimum: 1, maximum: 120}
        session_months: {type: integer, minimum: 1, maximum: 120}
        aggregation_months: {type: [integer, 'null'], minimum: 1, maximum: 1200}
        realtime_hours: {type: integer, minimum: 1, maximum: 168}
        debug_days: {type: integer, minimum: 1, maximum: 90}
security:
  - bearer: []
