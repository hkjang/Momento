<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="momento-edge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="edge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Transparent Background, Sharp Edge Monogram M + Analytics Wave -->
  <g filter="url(#edge-glow)">
    <!-- Main Neon M Wave Path -->
    <path d="M 16 88 L 16 34 L 44 80 L 60 50 L 76 80 L 104 28" 
          fill="none" 
          stroke="url(#momento-edge-grad)" 
          stroke-width="11" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <!-- Accent Pulsing Node Dots -->
    <circle cx="104" cy="28" r="7.5" fill="#06b6d4" />
    <circle cx="60" cy="50" r="5" fill="#a855f7" />
  </g>
</svg>
