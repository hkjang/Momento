services:
  postgres:
    image: postgres:17-alpine
    # Docker gives a container 64MB of /dev/shm, and PostgreSQL puts a parallel
    # query's shared hash tables and tuple queues there. A report that groups
    # millions of rows asks for more than that and the query does not slow down —
    # it fails, with "could not resize shared memory segment ... No space left on
    # device", which reaches the reader as a 500 on a screen that worked last
    # month. It appears only once a site is large enough for the planner to go
    # parallel, which is exactly when nobody is changing the deployment.
    shm_size: 1gb
    environment:
      POSTGRES_DB: momento
      POSTGRES_USER: momento
      POSTGRES_PASSWORD: momento-local-only
    volumes:
      - momento-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momento -d momento"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  momento:
    build:
      context: .
      # No VERSION argument: the image reports the version declared in the source
      # tree it was built from, which is what the console shows the operator.
      args:
        COMMIT: ${MOMENTO_COMMIT:-unknown}
    image: momento:v0.34.13
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MOMENTO_POSTGRES_DSN: ${MOMENTO_POSTGRES_DSN:-postgres://momento:momento-local-only@postgres:5432/momento?sslmode=disable}
      MOMENTO_BOOTSTRAP_ADMIN: ${MOMENTO_BOOTSTRAP_ADMIN:?set MOMENTO_BOOTSTRAP_ADMIN}
      MOMENTO_BOOTSTRAP_ADMIN_PASSWORD: ${MOMENTO_BOOTSTRAP_ADMIN_PASSWORD:?set MOMENTO_BOOTSTRAP_ADMIN_PASSWORD}
      MOMENTO_ENCRYPTION_KEY: ${MOMENTO_ENCRYPTION_KEY:-}
      MOMENTO_ENCRYPTION_KEY_PREVIOUS: ${MOMENTO_ENCRYPTION_KEY_PREVIOUS:-}
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  momento-postgres:
